# =============================================
#  Day 4 - Docker Compose Configuration
# =============================================

server.port=8080

# -----------------------------------------------
# DATABASE CONFIG
# These values come from environment variables
# set inside docker-compose.yml
#
# Format: ${ENV_VAR_NAME:default_value}
# The part after : is used when running LOCALLY
# (outside Docker) so you can still test easily.
# -----------------------------------------------
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tododb}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:secret}
spring.datasource.driver-class-name=org.postgresql.Driver

# -----------------------------------------------
# JPA CONFIG
# create-drop = creates tables on start, drops on stop
# Great for learning! Use 'validate' in production.
# -----------------------------------------------
#spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update


# Actuator - health check for Docker
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
